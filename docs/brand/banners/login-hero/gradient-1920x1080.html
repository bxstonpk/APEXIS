<!doctype html>
<html lang="th">
<head>
<meta charset="utf-8">
<title>APEXIS Hero — Gradient</title>
<link rel="stylesheet" href="fonts/fonts.css">
<style>
  /* Gradient / Color Wash — mesh gradient กรมท่า → น้ำเงิน → ส้ม + ริบบิ้นแสงไหลขึ้นสู่ยอด */
  :root { --navy:#101c3b; --blue:#1d3f8f; --sky:#3b6fd8; --orange:#f28c1a; --amber:#ffb547; }
  * { box-sizing:border-box; margin:0; padding:0; }
  html, body { width:1920px; height:1080px; overflow:hidden; }
  body { font-family:'Plex Thai', sans-serif; color:#fff; background:var(--navy); position:relative; }

  .mesh { position:absolute; inset:0;
    background:
      radial-gradient(60% 75% at 82% 18%, rgba(59,111,216,.95) 0%, transparent 60%),
      radial-gradient(45% 60% at 100% 100%, rgba(242,140,26,.85) 0%, transparent 62%),
      radial-gradient(40% 45% at 62% 78%, rgba(255,181,71,.35) 0%, transparent 70%),
      radial-gradient(70% 90% at 0% 0%, #1a2d63 0%, transparent 60%),
      linear-gradient(135deg, #0b1430 0%, #101c3b 45%, #172f6e 100%);
  }
  .grain { position:absolute; inset:0; opacity:.18; mix-blend-mode:overlay;
    background-image:url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='220' height='220'><filter id='n'><feTurbulence type='fractalNoise' baseFrequency='.9' numOctaves='3' stitchTiles='stitch'/></filter><rect width='100%' height='100%' filter='url(%23n)'/></svg>"); }
  svg.ribbons { position:absolute; inset:0; }

  .copy { position:absolute; left:192px; top:50%; transform:translateY(-50%); width:880px; }
  .brand { display:flex; align-items:center; gap:18px; font-weight:600; font-size:26px; letter-spacing:.32em; color:rgba(255,255,255,.8); }
  .brand i { display:block; width:56px; height:3px; border-radius:3px; background:linear-gradient(90deg, var(--orange), var(--amber)); }
  h1 { margin-top:36px; font-size:96px; line-height:1.12; font-weight:700; letter-spacing:-.01em; }
  h1 .hl { background:linear-gradient(90deg, #ffd08a 0%, var(--orange) 55%, #ff7a3d 100%); -webkit-background-clip:text; background-clip:text; color:transparent; }
  p.sub { margin-top:32px; font-size:30px; line-height:1.6; color:rgba(255,255,255,.78); max-width:760px; }
  .chips { margin-top:56px; display:flex; flex-wrap:wrap; gap:14px; }
  .chips span { padding:12px 22px; border-radius:999px; font-size:22px; font-weight:500; color:#fff;
    background:rgba(255,255,255,.08); border:1px solid rgba(255,255,255,.18); }
  .foot { position:absolute; left:192px; bottom:96px; font-size:20px; letter-spacing:.18em; color:rgba(255,255,255,.45); }
</style>
</head>
<body>
  <div class="mesh"></div>
  <svg class="ribbons" viewBox="0 0 1920 1080" fill="none" aria-hidden="true">
    <defs>
      <linearGradient id="r1" x1="900" y1="1000" x2="1900" y2="80" gradientUnits="userSpaceOnUse">
        <stop offset="0" stop-color="#3b6fd8" stop-opacity="0"/>
        <stop offset=".45" stop-color="#6c95ff" stop-opacity=".55"/>
        <stop offset="1" stop-color="#ffb547" stop-opacity=".95"/>
      </linearGradient>
      <linearGradient id="r2" x1="1000" y1="1080" x2="1920" y2="200" gradientUnits="userSpaceOnUse">
        <stop offset="0" stop-color="#f28c1a" stop-opacity="0"/>
        <stop offset=".6" stop-color="#f28c1a" stop-opacity=".7"/>
        <stop offset="1" stop-color="#ffd08a" stop-opacity="1"/>
      </linearGradient>
      <linearGradient id="bar" x1="0" y1="0" x2="0" y2="1">
        <stop offset="0" stop-color="#fff" stop-opacity=".28"/>
        <stop offset="1" stop-color="#fff" stop-opacity="0"/>
      </linearGradient>
      <filter id="glow" x="-20%" y="-20%" width="140%" height="140%"><feGaussianBlur stdDeviation="10"/></filter>
    </defs>
    <!-- แท่งกราฟโปร่งแสงไล่สูง (การเติบโต) -->
    <g>
      <rect x="1180" y="700" width="70" height="380" rx="10" fill="url(#bar)"/>
      <rect x="1280" y="610" width="70" height="470" rx="10" fill="url(#bar)"/>
      <rect x="1380" y="505" width="70" height="575" rx="10" fill="url(#bar)"/>
      <rect x="1480" y="390" width="70" height="690" rx="10" fill="url(#bar)"/>
      <rect x="1580" y="265" width="70" height="815" rx="10" fill="url(#bar)"/>
    </g>
    <!-- ริบบิ้นแสงหลายเส้น ไหลขึ้นขวาบน -->
    <g stroke="url(#r1)" stroke-linecap="round">
      <path d="M760 1100 C 1100 900, 1380 760, 1960 180" stroke-width="2"/>
      <path d="M800 1100 C 1140 920, 1420 790, 1960 230" stroke-width="2"/>
      <path d="M840 1100 C 1180 940, 1460 820, 1960 280" stroke-width="2"/>
      <path d="M880 1100 C 1220 960, 1500 850, 1960 330" stroke-width="2"/>
      <path d="M920 1100 C 1260 980, 1540 880, 1960 380" stroke-width="2"/>
    </g>
    <path d="M700 1120 C 1080 900, 1400 700, 1960 120" stroke="url(#r2)" stroke-width="26" stroke-linecap="round" filter="url(#glow)" opacity=".55"/>
    <path d="M700 1120 C 1080 900, 1400 700, 1960 120" stroke="url(#r2)" stroke-width="6" stroke-linecap="round"/>
    <!-- จุดยอด -->
    <circle cx="1652" cy="400" r="12" fill="#ffd08a"/>
    <circle cx="1652" cy="400" r="34" fill="#ffb547" opacity=".25"/>
  </svg>
  <div class="grain"></div>

  <div class="copy">
    <div class="brand"><i></i>APEXIS · ERP</div>
    <h1>ERP สำหรับ<br><span class="hl">ธุรกิจไทย</span></h1>
    <p class="sub">ขาย จัดซื้อ คลังสินค้า การเงิน และบัญชี เชื่อมกันในระบบเดียว ลงบัญชีให้อัตโนมัติจากทุกเอกสาร</p>
    <div class="chips"><span>ขาย</span><span>จัดซื้อ</span><span>คลังสินค้า</span><span>การเงิน</span><span>บัญชี</span></div>
  </div>
  <div class="foot">ENTERPRISE RESOURCE PLANNING</div>
</body>
</html>
