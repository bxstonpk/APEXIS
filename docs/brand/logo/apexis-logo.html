<!doctype html>

<link rel="stylesheet" href="../banners/login-hero/fonts/fonts.css">

  * { margin:0; padding:0; box-sizing:border-box; }
  body { font-family:'Plex Thai', sans-serif; background:transparent; padding:24px; display:flex; flex-direction:column; gap:24px; align-items:flex-start; }
  #lockup { display:inline-flex; align-items:center; gap:22px; padding:8px 12px 12px 4px; }
  #lockup b { display:block; font-weight:700; font-size:76px; line-height:1; letter-spacing:.04em; color:#101c3b; }
  #lockup b i { font-style:normal; background:linear-gradient(45deg, #ff7a2f, #f28c1a 55%, #ffd08a); -webkit-background-clip:text; background-clip:text; color:transparent; }
  #lockup small { display:block; margin-top:12px; font-size:13.4px; font-weight:500; letter-spacing:.36em; color:#5a6376; }
  #favicon { width:32px; height:32px; display:flex; }
  #touch { width:180px; height:180px; display:flex; align-items:center; justify-content:center; background:radial-gradient(80% 80% at 30% 0%, #2a4fc2, #101c3b 72%); }
</style></head>
